[package]
name = "turnpike"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "Personal LLM API usage meter — localhost reverse proxy"
license = "MIT"
repository = "https://github.com/wilbeibi/turnpike"
readme = "README.md"
keywords = ["llm", "proxy", "metering", "cost", "openai"]
categories = ["command-line-utilities", "development-tools"]

# Where `cargo binstall turnpike` looks for the tarballs .github/workflows/
# release.yml uploads. The archive holds the bare binary, not a leading dir.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "turnpike"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["rt", "macros", "fs", "signal", "net", "sync"] }
axum         = "0.7"
reqwest      = { version = "0.12", features = ["stream", "http2", "rustls-tls"], default-features = false }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
clap         = { version = "4", features = ["derive"] }
jiff         = { version = "0.2", features = ["serde"] }
bytes        = "1"
futures-util = "0.3"
anyhow       = "1"
aho-corasick = "1"
getrandom    = "0.2"
log          = "0.4"
env_logger   = "0.11"
rusqlite     = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
proptest = "1"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
